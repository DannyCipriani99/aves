name: Build APK

# Builds an installable APK (signed with a throwaway key) so the app can be tested on a phone.
# Runs on every push to a `feature/**` branch, or manually from the Actions tab.
on:
  push:
    branches: [ "feature/**" ]
  workflow_dispatch:

permissions: read-all

jobs:
  build_apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - name: Set up JDK for Android Gradle plugin
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Flutter packages
        run: |
          ./flutterw doctor -v
          ./flutterw pub get

      - name: Remove build ID from native lib
        run: |
          PUB_CACHE=$HOME/.pub-cache
          sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt 2>/dev/null || true

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      - name: Create a throwaway signing key
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/key.jks" -storetype JKS \
            -alias aves -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=Aves Test, O=Test, C=US"

      - name: Build APK
        run: |
          NDK_VERSION=28.2.13676358
          export ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION
          export ANDROID_NDK_HOME=$ANDROID_NDK
          export ANDROID_NDK_ROOT=$ANDROID_NDK
          export AVES_GOOGLE_API_KEY="NONE"
          mkdir outputs
          scripts/apply_flavor_libre.sh
          ./flutterw build apk -t lib/main_libre.dart --flavor libre --split-per-abi
          cp build/app/outputs/apk/libre/release/*.apk outputs
        env:
          AVES_STORE_FILE: ${{ github.workspace }}/key.jks
          AVES_STORE_PASSWORD: android123
          AVES_KEY_ALIAS: aves
          AVES_KEY_PASSWORD: android123

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aves-apk
          path: outputs/*.apk

      # Publishes the APKs in the Releases list (only for builds of the main branch)
      - name: Create release
        if: github.ref_name == 'develop'
        run: |
          gh release create "build-${{ github.run_number }}" outputs/*.apk \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "APK build from commit ${{ github.sha }}. For most phones, install the \`arm64-v8a\` file."
        env:
          GH_TOKEN: ${{ github.token }}
